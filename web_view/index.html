<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monitoramento - Visualização</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page-shell">
    <header class="site-header">
      <div>
        <h1 class="site-title">Monitoramento Solar</h1>
        <p class="site-description">Visualização dos dados em tempo real do Firebase.</p>
      </div>
    </header>

    <section class="status-panel">
      <div class="status-row">
        <div class="status-item">
          <span class="status-label">Status</span>
          <span id="status-text" class="status-value">Carregando...</span>
        </div>
        <div class="status-item">
          <span class="status-label">Atualização</span>
          <span id="status-time" class="status-value">Aguardando...</span>
        </div>
      </div>
      <p class="status-label">Os dados são atualizados automaticamente a cada 2 segundos.</p>
    </section>

    <section class="data-table-card">
      <div class="table-toolbar">
        <div>
          <h2 class="table-title">Parâmetros em tempo real</h2>
        </div>
      </div>

      <div class="table-wrapper">
        <table id="data-table" hidden>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Valor</th>
              <th>Unidade</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
